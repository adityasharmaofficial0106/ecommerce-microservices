spring:
  application:
    name: user-service

  datasource:
    # URL has a local default; credentials have NO default and must come from the environment.
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5432/ecommerce_user_db}
    username: ${USER_DB_USERNAME}
    password: ${USER_DB_PASSWORD}
    hikari:
      pool-name: user-service-hikari
      maximum-pool-size: ${USER_DB_MAX_POOL_SIZE:10}

  jpa:
    # Do not keep the Hibernate session open during view rendering; all DB work
    # happens inside service-layer transactions. Avoids hidden lazy-loading queries.
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

  data:
    web:
      pageable:
        default-page-size: 20
        # Protects the service from ?size=1000000
        max-page-size: 100

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${USER_SERVICE_PORT:8081}
  # Finish in-flight requests before shutting down (important in containers)
  shutdown: graceful

jwt:
  # Where the RSA key pair lives. This service is the only one that holds a PRIVATE key,
  # and therefore the only one that can issue a token. RsaKeyProvider generates the pair
  # on first startup if the directory is empty, so there is no secret to invent, paste or
  # share by hand. The directory is git-ignored.
  key-directory: ${JWT_KEY_DIR:../keys}
  # Short on purpose. A token cannot be un-issued, so expiry is what bounds the damage
  # when one leaks or an account is deactivated. See the walkthrough.
  expiry-minutes: ${JWT_EXPIRY_MINUTES:15}
  issuer: ecommerce-user-service

login-rate-limit:
  # Stops one machine from trying many accounts. Generous enough for an office or a
  # household sharing one public IP address.
  per-ip:
    capacity: 50
    refill-every: 2s
  # Stops many machines from trying one account. A person who mistypes has five tries,
  # then one more per minute; a password-guessing script gets about 1,440 guesses a day
  # instead of millions.
  per-email:
    capacity: 5
    refill-every: 1m
  # Upper bound on buckets held in memory, so random emails cannot exhaust the heap.
  max-tracked-keys: 100000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # Exposes /actuator/health/liveness and /actuator/health/readiness
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.ecommerce.user: INFO
